# Firebase App Hosting configuration
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  maxInstances: 3
  minInstances: 0
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_GOOGLE_GENAI_API_KEY
    secret: NEXT_PUBLIC_GOOGLE_GENAI_API_KEY
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: studio-5790524114-6339d.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: studio-5790524114-6339d
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:170365007214:web:fa9ea9040cb5d306c23d7f
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "170365007214"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_UNSPLASH_ACCESS_KEY
    value: Bppbs8JwxHz9HMlsl_cMNaR01iLqor0rof02opqIqTI
    availability:
      - BUILD
      - RUNTIME
